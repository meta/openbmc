[Service]
# Run mctpd as root, as it did before the upstream change that made it an
# unprivileged user (CodeConstruct/mctp 4519db9, part of v2.6). The downstream
# patches in this layer still need root: patch 0500 lists the MCTPEndpoint
# configs through ObjectMapper.GetSubTreePaths(), which the mapper only accepts
# from privileged callers, and platform helpers hooked on to this unit inherit
# the service user.
# Named so that a platform which does not need root can override it with a
# later-sorting drop-in that sets User=mctpd.
User=root
