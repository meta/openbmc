# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have common/recipes-* directories, add to BBFILES
BBFILES += "\
    ${LAYERDIR}/common/recipes-*/*/*.bb \
    ${LAYERDIR}/common/recipes-*/*/*.bbappend \
"

# LFOpenBMC systems also have recipes in common/lfopenbmc.
# This is detected by using the 'phosphor-layer' (see BBFILE_COLLECTIONS in
# meta-phosphor/conf/layer.conf).
BBFILES_DYNAMIC += "\
    phosphor-layer:${LAYERDIR}/common/lfopenbmc/recipes-*/*/*.bb \
    phosphor-layer:${LAYERDIR}/common/lfopenbmc/recipes-*/*/*.bbappend \
    tpm-layer:${LAYERDIR}/common/tpm-layer/recipes-*/*/*.bb \
    tpm-layer:${LAYERDIR}/common/tpm-layer/recipes-*/*/*.bbappend \
    zephyrcore:${LAYERDIR}/common/lfopenbmc/zephyrcore/recipes-*/*/*.bb \
    zephyrcore:${LAYERDIR}/common/lfopenbmc/zephyrcore/recipes-*/*/*.bbappend \
"

# LFOpenBMC Facebook internal recipes
BBFILES_DYNAMIC += " \
  phosphor-layer:${LAYERDIR}/common/facebook/lfopenbmc/recipes-*/*/*.bb \
  phosphor-layer:${LAYERDIR}/common/facebook/lfopenbmc/recipes-*/*/*.bbappend \
"

# Facebook internal common recipes
# NOTICE:
#   order is matter bitbake apply bbappend in order
#   listed here, so keep internal recipes in last
#   to make sure it is applied last
BBFILES += "\
	${LAYERDIR}/common/facebook/recipes-*/*/*.bb \
	${LAYERDIR}/common/facebook/recipes-*/*/*.bbappend \
"
#   Any proprietary code.
BBFILES += "\
	${LAYERDIR}/proprietary/*/*/*.bb \
	${LAYERDIR}/proprietary/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "openbmc"
BBFILE_PATTERN_openbmc = "^${LAYERDIR_RE}/(common/(recipes|facebook)|proprietary)"
BBFILE_PRIORITY_openbmc = "6"

LAYERSERIES_COMPAT_openbmc = "wrynose whinlatter walnascar styhead scarthgap nanbield kirkstone dunfell rocko"

INHERIT += "local-source"
