# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILES_DYNAMIC += "\
    meta-arm:${LAYERDIR}/dynamic-layers/arm-layer/recipes-*/*/*.bb \
    meta-arm:${LAYERDIR}/dynamic-layers/arm-layer/recipes-*/*/*.bbappend \
"

# The Caliptra tools need cargo-update-recipe-crates and bitbake's crate
# fetcher, which older releases parsing this layer (rocko, dunfell,
# kirkstone) lack, so hide them there.
BBMASK .= "${@'' if ( \
    bb.utils.which(d.getVar('BBPATH'), 'classes-recipe/cargo-update-recipe-crates.bbclass') or \
    bb.utils.which(d.getVar('BBPATH'), 'classes/cargo-update-recipe-crates.bbclass') \
    ) else ' meta-aspeed/recipes-support/caliptra-mcu-sw/ meta-aspeed/recipes-aspeed/cptra-imgtool/'}"

BBFILE_COLLECTIONS += "aspeed"
BBFILE_PATTERN_aspeed = "^${LAYERDIR}/"
BBFILE_PRIORITY_aspeed = "7"

LAYERSERIES_COMPAT_aspeed = "wrynose whinlatter walnascar styhead scarthgap nanbield kirkstone dunfell rocko"
