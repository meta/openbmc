BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"


BBFILES_DYNAMIC += "\
    zephyrcore:${LAYERDIR}/dynamic-layers/zephyrcore-layer/recipes-*/*/*.bb \
    zephyrcore:${LAYERDIR}/dynamic-layers/zephyrcore-layer/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "acctonbmc27xx"
BBFILE_PATTERN_acctonbmc27xx = "^${LAYERDIR}/"
BBFILE_PRIORITY_acctonbmc27xx = "25"

LAYERSERIES_COMPAT_acctonbmc27xx = "wrynose whinlatter walnascar styhead scarthgap nanbield kirkstone dunfell"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd usrmerge"
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES_OPTED_OUT += "sysvinit"
