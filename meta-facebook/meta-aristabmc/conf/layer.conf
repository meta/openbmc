BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "aristabmc"
BBFILE_PATTERN_aristabmc = "^${LAYERDIR}/"
BBFILE_PRIORITY_aristabmc = "25"

LAYERSERIES_COMPAT_aristabmc = "wrynose whinlatter walnascar styhead scarthgap nanbield kirkstone dunfell"

# Yocto master no longer supplies this distro variable.  The FB distro
# expands it lazily, so provide an empty Aristabmc-local default.
DISTRO_FEATURES_LIBC ??= ""
INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd usrmerge"
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES_OPTED_OUT += "sysvinit"
