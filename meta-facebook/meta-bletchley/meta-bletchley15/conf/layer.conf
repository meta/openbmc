# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "fb-bletchley15-layer"
BBFILE_PATTERN_fb-bletchley15-layer := "^${LAYERDIR}/"

LAYERSERIES_COMPAT_fb-bletchley15-layer := "blacksail wrynose whinlatter walnascar styhead scarthgap nanbield kirkstone"
