# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	          ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/facebook/recipes-*/*/*.bb \
	          ${LAYERDIR}/facebook/recipes-*/*/*.bbappend"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd usrmerge"
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES_OPTED_OUT += "sysvinit"

BBFILE_COLLECTIONS += "elbert"
BBFILE_PATTERN_elbert = "^${LAYERDIR}/"
BBFILE_PRIORITY_elbert = "20"

LAYERSERIES_COMPAT_elbert = "blacksail wrynose whinlatter walnascar styhead scarthgap nanbield kirkstone dunfell"
