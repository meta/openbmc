# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Zephyr firmware recipes for AST2700 machines; parsed only when the build
# includes meta-zephyr-core.
BBFILES_DYNAMIC += "\
    zephyrcore:${LAYERDIR}/dynamic-layers/zephyrcore-layer/recipes-*/*/*.bb \
    zephyrcore:${LAYERDIR}/dynamic-layers/zephyrcore-layer/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "fboss-lite"
BBFILE_PATTERN_fboss-lite = "^${LAYERDIR}/"
BBFILE_PRIORITY_fboss-lite = "20"

LAYERSERIES_COMPAT_fboss-lite = "wrynose whinlatter walnascar styhead scarthgap nanbield kirkstone dunfell"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES_OPTED_OUT += "sysvinit"
