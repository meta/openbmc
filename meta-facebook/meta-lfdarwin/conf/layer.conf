# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "fb-lfdarwin-layer"
BBFILE_PATTERN_fb-lfdarwin-layer := "^${LAYERDIR}/"

LAYERSERIES_COMPAT_fb-lfdarwin-layer := "blacksail wrynose whinlatter walnascar scarthgap"
