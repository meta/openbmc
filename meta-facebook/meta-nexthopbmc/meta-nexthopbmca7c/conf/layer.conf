BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "nexthopbmca7c"
BBFILE_PATTERN_nexthopbmca7c = "^${LAYERDIR}/"
BBFILE_PRIORITY_nexthopbmca7c = "25"

# Child of meta-nexthopbmc: builds on the parent's recipes and appends, and
# carries only what differs for nexthopbmca7c.
LAYERDEPENDS_nexthopbmca7c = "nexthopbmc"

LAYERSERIES_COMPAT_nexthopbmca7c = "wrynose whinlatter walnascar styhead scarthgap nanbield kirkstone dunfell"

# meta-zephyr-core's layer.conf references DISTRO_FEATURES_LIBC, which the
# openbmc-fb-master distro does not define.
DISTRO_FEATURES_LIBC ??= ""
