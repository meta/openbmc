#@TYPE: Machine
#@NAME: nexthopbmca7c
#@DESCRIPTION: Machine configuration for the Nexthop AST2720-A2 BMC card

# The AST2720 is a member of the AST2700 (aspeed-g7) family: Cortex-A35
# application cores plus a RISC-V BootMCU and the SSP/TSP service
# processors, all fronted by Caliptra.  The flash image therefore starts
# with a Caliptra "manifest bundle" (Caliptra FW, SoC manifest, BootMCU
# runtime, DDR PHY / DP / UEFI prebuilts, TF-A, OP-TEE, U-Boot, SSP, TSP)
# instead of a bare U-Boot, see recipes-core/images/nexthopbmca7c-image-layout.inc.
#
# meta-fboss-lite's AST2720 machine include holds the settings shared by
# FBOSS AST2720 machines; this file adds only what is specific to this board.
require conf/machine/fboss-lite-ast2720.inc

# BMC console: AST2700 debug UART (UART12).  Nexthop boards run the BMC
# console at 9600 baud.
SERIAL_CONSOLES:nexthopbmca7c = "9600;ttyS12"

# Mask meta-aspeed's legacy u-boot-tools recipes (v2019.x), which
# fboss-lite machines pin, so the build uses the u-boot-tools from poky.
BBMASK:append = " meta-aspeed/recipes-bsp/u-boot/u-boot-tools_2019"

# ast2700.inc masks linux-aspeed_6.12; the parent meta-nexthopbmc layer's
# 6.12 kernel append (nexthopbmc patches) would otherwise be left dangling.
BBMASK:append = " meta-facebook/meta-nexthopbmc/recipes-kernel/linux/linux-aspeed_6.12.bbappend"

# Start from the AST2700 EVB defconfig; u-boot-aspeed-sdk/nexthopbmca7c.cfg
# sets the console, prompt and watchdog options.
UBOOT_MACHINE:nexthopbmca7c = "evb-ast2700_defconfig"
UBOOT_DEVICETREE = "aspeed-bmc-facebook-nexthopbmca7c"

#
# Zephyr firmware for the BootMCU, SSP and TSP; meta-fboss-lite carries the
# recipes for FBOSS machines.
#
PREFERRED_PROVIDER_virtual/bootmcu = "zephyr-aspeed-bootmcu"
BOOTMCU_FW_BINARY = "ast2700-mcu-runtime.bin"
ZEPHYR_BOARD_BOOTMCU = "ast2700_evb/ast2700/bootmcu"

MACHINE_FEATURES:append = " ast-ssp ast-tsp"
MACHINEOVERRIDES .= ":ast-ssp:ast-tsp"
PREFERRED_PROVIDER_virtual/ssp = "zephyr-aspeed-ssp"
PREFERRED_PROVIDER_virtual/tsp = "zephyr-aspeed-tsp"
ZEPHYR_BOARD_SSP = "ast2700_evb/ast2700/ssp_tsp"
ZEPHYR_BOARD_TSP = "ast2700_evb/ast2700/tsp"

PREFERRED_VERSION_zephyr-sdk-native = "0.16.9"
PREFERRED_VERSION_zephyr-kernel ??= "3.7.0"

#
# Kernel: AST2700 is only supported from 6.18 on.
#
KERNEL_DEVICETREE = "aspeed/aspeed-bmc-facebook-nexthopbmca7c.dtb"
PREFERRED_VERSION_linux-aspeed = "6.18.%"
