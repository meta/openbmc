# nexthopbmca7c tweaks on top of evb-ast2700_defconfig.
# BMC console is UART12 (ttyS12 in Linux) at 9600 baud.
CONFIG_BAUDRATE=9600
CONFIG_USE_BOOTARGS=y
CONFIG_BOOTARGS="console=ttyS12,9600n8 root=/dev/ram rw"
CONFIG_SYS_PROMPT="nexthopbmca7c-boot=> "
CONFIG_DEFAULT_DEVICE_TREE="aspeed-bmc-facebook-nexthopbmca7c"
CONFIG_PHY_FIXED=y
# The EVB defconfig enables FIT signature enforcement, which refuses FIT
# node names with unit addresses ("kernel@1").  The fboss-lite FIT generator
# (meta-aspeed verified-boot.inc) uses that naming and this image carries no
# verified-boot keys, so drop the enforcement.
# CONFIG_FIT_SIGNATURE is not set
# CONFIG_FIT_FULL_CHECK is not set
