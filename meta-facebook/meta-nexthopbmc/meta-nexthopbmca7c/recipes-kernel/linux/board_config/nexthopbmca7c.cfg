# nexthopbmca7c (AST2720-A2) kernel configuration fragment, on top of the
# ast2700 defconfig.

# UART DMA for the AST2700 UARTs (UART12 is the BMC console).
CONFIG_ASPEED_UDMA=y

# The BootMCU/U-Boot leave WDT0 running; keep servicing it until userspace
# takes over instead of letting the kernel stop it.
CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y

# Board EEPROMs and the host CPU's APML (SB-RMI, SB-TSI) sensors.
CONFIG_EEPROM_AT24=y
CONFIG_APML_SBRMI=m
CONFIG_APML_SBTSI=m

# gpiocli and setup-gpio.sh use the GPIO sysfs ABI.
CONFIG_GPIO_SYSFS=y

# Overlayfs stores redirect and UUID metadata as xattrs on rwfs.
CONFIG_UBIFS_FS_XATTR=y

# USB gadget (usb-console) on the AST2700 virtual hub.
CONFIG_USB_LIBCOMPOSITE=m
CONFIG_USB_F_ACM=m
CONFIG_USB_U_SERIAL=m
CONFIG_USB_U_ETHER=m
CONFIG_USB_F_SERIAL=m
CONFIG_USB_F_NCM=m
CONFIG_USB_F_ECM=m
CONFIG_USB_F_EEM=m
CONFIG_USB_F_SUBSET=m
CONFIG_USB_F_RNDIS=m
CONFIG_USB_F_MASS_STORAGE=m
CONFIG_USB_F_HID=m
CONFIG_USB_CONFIGFS_SERIAL=y
CONFIG_USB_ETH=m
CONFIG_USB_ETH_RNDIS=y
CONFIG_USB_ETH_EEM=y
CONFIG_USB_G_NCM=m
CONFIG_USB_CDC_COMPOSITE=m

# Number the BMC flash partitions like the AST2620 fboss-lite machines
# (mtd0 u-boot, mtd1 env, ..., mtd5 flash0) instead of exposing each chip as
# its own MTD ahead of its partitions.
# CONFIG_MTD_PARTITIONED_MASTER is not set
